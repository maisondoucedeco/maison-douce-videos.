name: Render public Maison Douce video

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out public media repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required tools
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate video
        run: python scripts/create_video.py
      - name: Store uniquely named MP4 in public repository
        id: save
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p videos
          mv outputs/maison_douce_test.mp4 "videos/maison-douce-${RUN_ID}.mp4"
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/videos/maison-douce-${RUN_ID}.mp4" >> "$GITHUB_OUTPUT"
      - name: Commit ONLY MP4 into public repository
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "videos/maison-douce-${RUN_ID}.mp4"
          git commit -m "Add video from run ${RUN_ID}"
          git push
      - name: Show public video URL
        run: echo "${{ steps.save.outputs.url }}"
